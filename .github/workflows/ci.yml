# OGC v2 CI (NON-PRODUCTION). Build/test gates only — no deploy, no secrets, no production.
# Provided as a design artifact; the repository is local-only under the current authorization.
name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm lint
      - run: pnpm --filter @ogc/web test # unit + component + accessibility (axe)
      - run: pnpm --filter @ogc/web build
      # Optional E2E: provisions a browser only on a hosted runner. Non-blocking so the
      # core gates above remain authoritative; the local script resolves a pre-installed
      # Playwright instead of downloading one.
      - name: E2E smoke (Playwright)
        continue-on-error: true
        run: |
          pnpm --filter @ogc/web exec playwright install --with-deps chromium || true
          node e2e/smoke.mjs || echo "E2E skipped/soft-failed (non-blocking)"
