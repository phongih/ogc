# OGC v2 CI (NON-PRODUCTION). Build/test gates only — no deploy, no secrets, no production.
# Runs on every push and PR to phongih/ogc; a PR merges only when this job passes.
name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    # Platform backend tests (ADR-040) run against a real PostgreSQL. Throwaway, CI-only credentials.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OGC_TEST_PG_ADMIN_URL: postgres://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — the pinned toolchain comes solely from the
      # "packageManager" field in package.json (REL-028). Declaring both makes
      # pnpm/action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm lint
      # Build the backend FIRST: the web conformance suite (conformance.http.test.ts)
      # spawns the built catalog-api server to run the shared CatalogPort cases against
      # the real localhost HTTP backend. Must precede the web test step on a clean runner.
      - run: pnpm --filter @ogc/catalog-api build
      - run: pnpm --filter @ogc/web test # unit + component + accessibility (axe) + conformance (mock+http)
      - run: pnpm --filter @ogc/catalog-api test # backend contract/negative/leakage
      - run: pnpm --filter @ogc/iios-mock test # mock IIOS: issue / resolve / revoke / narrowing
      - run: pnpm --filter @ogc/api test # Platform API on PostgreSQL: RLS, audit, idempotency, fail-closed
      - run: pnpm --filter @ogc/iios-mock build
      - run: pnpm --filter @ogc/api build
      - run: pnpm --filter @ogc/web build
      - run: pnpm --filter @ogc/web build:platform
      # ADR-040 §5: the demo and Platform builds must not leak into each other.
      - run: node ops/release/check-bundle.mjs demo apps/web/dist
      - run: node ops/release/check-bundle.mjs platform apps/web/dist-platform
      - run: node ops/release/test/release.test.mjs # release toolkit (browser smoke self-skips without Playwright)
      # Optional E2E: provisions a browser only on a hosted runner. Non-blocking so the
      # core gates above remain authoritative; the local script resolves a pre-installed
      # Playwright instead of downloading one.
      - name: E2E smoke (Playwright)
        continue-on-error: true
        run: |
          pnpm --filter @ogc/web exec playwright install --with-deps chromium || true
          node e2e/smoke.mjs || echo "smoke E2E skipped/soft-failed (non-blocking)"
          node e2e/catalog-http.mjs || echo "catalog HTTP E2E skipped/soft-failed (non-blocking)"
          node e2e/practice-journey.mjs || echo "practice journey E2E skipped/soft-failed (non-blocking)"
          node e2e/speaking-journey.mjs || echo "speaking journey E2E skipped/soft-failed (non-blocking)"
          node e2e/attendance-journey.mjs || echo "attendance journey E2E skipped/soft-failed (non-blocking)"
          node e2e/operations-journey.mjs || echo "operations journey E2E skipped/soft-failed (non-blocking)"
          node e2e/makeup-journey.mjs || echo "make-up journey E2E skipped/soft-failed (non-blocking)"
          node e2e/center-setup-journey.mjs || echo "center-setup journey E2E skipped/soft-failed (non-blocking)"
          node e2e/persistence-journey.mjs || echo "persistence journey E2E skipped/soft-failed (non-blocking)"
          node e2e/engine-journey.mjs || echo "decision-engine journey E2E skipped/soft-failed (non-blocking)"
          node e2e/access-journey.mjs || echo "access-policy journey E2E skipped/soft-failed (non-blocking)"
          node e2e/gamification-journey.mjs || echo "gamification journey E2E skipped/soft-failed (non-blocking)"
          node e2e/growth-journey.mjs || echo "growth journey E2E skipped/soft-failed (non-blocking)"
          node e2e/billing-journey.mjs || echo "billing journey E2E skipped/soft-failed (non-blocking)"
          node e2e/admissions-journey.mjs || echo "admissions journey E2E skipped/soft-failed (non-blocking)"
          node e2e/students-journey.mjs || echo "students journey E2E skipped/soft-failed (non-blocking)"
          node e2e/workforce-journey.mjs || echo "workforce journey E2E skipped/soft-failed (non-blocking)"
          node e2e/forecast-journey.mjs || echo "forecast journey E2E skipped/soft-failed (non-blocking)"
          node e2e/partners-journey.mjs || echo "partners journey E2E skipped/soft-failed (non-blocking)"
          node e2e/studio-journey.mjs || echo "studio journey E2E skipped/soft-failed (non-blocking)"
          node e2e/platform-journey.mjs || echo "platform journey E2E skipped/soft-failed (non-blocking)"
          node e2e/platform-makeup-journey.mjs || echo "platform make-up E2E skipped/soft-failed (non-blocking)"
          node e2e/platform-workforce-journey.mjs || echo "platform workforce E2E skipped/soft-failed (non-blocking)"
          node e2e/platform-admissions-journey.mjs || echo "platform admissions E2E skipped/soft-failed (non-blocking)"
          node e2e/platform-billing-journey.mjs || echo "platform billing E2E skipped/soft-failed (non-blocking)"
          node e2e/platform-partners-journey.mjs || echo "platform partners E2E skipped/soft-failed (non-blocking)"
          node e2e/platform-partners-settlements-journey.mjs || echo "platform partners settlements E2E skipped/soft-failed (non-blocking)"
          node e2e/platform-course-studio-journey.mjs || echo "platform course studio E2E skipped/soft-failed (non-blocking)"
          node e2e/platform-class-courses-journey.mjs || echo "platform class courses E2E skipped/soft-failed (non-blocking)"
          node e2e/platform-students-journey.mjs || echo "platform students E2E skipped/soft-failed (non-blocking)"
