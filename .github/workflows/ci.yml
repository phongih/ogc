# OGC v2 CI (NON-PRODUCTION). Build/test gates only — no deploy, no secrets, no production.
# Provided as a design artifact; the repository is local-only under the current authorization.
name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm lint
      - run: pnpm --filter @ogc/web test
      - run: pnpm --filter @ogc/web build
