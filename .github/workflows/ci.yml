# OGC v2 CI (NON-PRODUCTION). Build/test gates only — no deploy, no secrets, no production.
# Runs on every push and PR to phongih/ogc; a PR merges only when this job passes.
name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — the pinned toolchain comes solely from the
      # "packageManager" field in package.json (REL-028). Declaring both makes
      # pnpm/action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm lint
      # Build the backend FIRST: the web conformance suite (conformance.http.test.ts)
      # spawns the built catalog-api server to run the shared CatalogPort cases against
      # the real localhost HTTP backend. Must precede the web test step on a clean runner.
      - run: pnpm --filter @ogc/catalog-api build
      - run: pnpm --filter @ogc/web test # unit + component + accessibility (axe) + conformance (mock+http)
      - run: pnpm --filter @ogc/catalog-api test # backend contract/negative/leakage
      - run: pnpm --filter @ogc/web build
      - run: node ops/release/test/release.test.mjs # release toolkit (browser smoke self-skips without Playwright)
      # Optional E2E: provisions a browser only on a hosted runner. Non-blocking so the
      # core gates above remain authoritative; the local script resolves a pre-installed
      # Playwright instead of downloading one.
      - name: E2E smoke (Playwright)
        continue-on-error: true
        run: |
          pnpm --filter @ogc/web exec playwright install --with-deps chromium || true
          node e2e/smoke.mjs || echo "smoke E2E skipped/soft-failed (non-blocking)"
          node e2e/catalog-http.mjs || echo "catalog HTTP E2E skipped/soft-failed (non-blocking)"
          node e2e/practice-journey.mjs || echo "practice journey E2E skipped/soft-failed (non-blocking)"
          node e2e/speaking-journey.mjs || echo "speaking journey E2E skipped/soft-failed (non-blocking)"
          node e2e/attendance-journey.mjs || echo "attendance journey E2E skipped/soft-failed (non-blocking)"
          node e2e/operations-journey.mjs || echo "operations journey E2E skipped/soft-failed (non-blocking)"
          node e2e/makeup-journey.mjs || echo "make-up journey E2E skipped/soft-failed (non-blocking)"
